[build-system]
requires = ["setuptools>=62.3"]  # `**` in package-data, so a skill directory ships whole
build-backend = "setuptools.build_meta"

[project]
name = "loomground-mcp"
description = "One MCP server exposing the Loomground planes as tools: versum, the four languages, solver and its skills, ingest, operators, assurance, controls; stdio or HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# `mcp` is the one third-party dependency. Every other name is a sibling plane.
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
# policy-compiler, evidence-emitter, privacy-shield and a2a-compliance have no tag
# carrying what their range meant, so each is a commit on its public main instead.
dependencies = [
    "mcp>=2,<3",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@loomground-governance-v0.11.1",
    "loomground-versum @ git+https://github.com/flxk1/loomground-versum@loomground-versum-v0.14.0",
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@loomground-deontic-v0.2.1",
    "loomground-factual @ git+https://github.com/flxk1/loomground-factual@factual-v0.1.0",
    "loomground-epistemic @ git+https://github.com/flxk1/loomground-epistemic@epistemic-v0.1.0",
    "loomground-norm @ git+https://github.com/flxk1/loomground-norm@norm-v0.1.1",
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@solver-v0.6.0",
    "loomground-ingest @ git+https://github.com/flxk1/loomground-ingest@loomground-ingest-v0.3.0",
    "loomground-brief @ git+https://github.com/flxk1/loomground-brief@loomground-brief-v0.2.0",
    "loomground-collapse @ git+https://github.com/flxk1/loomground-collapse@loomground-collapse-v0.2.0",
    "loomground-escalation @ git+https://github.com/flxk1/loomground-escalation@loomground-escalation-v0.2.0",
    "loomground-falsifiability @ git+https://github.com/flxk1/loomground-falsifiability@loomground-falsifiability-v0.2.0",
    "loomground-proxy @ git+https://github.com/flxk1/loomground-proxy@loomground-proxy-v0.2.0",
    "loomground-mandate @ git+https://github.com/flxk1/loomground-mandate@loomground-mandate-v0.2.0",
    "oversight-certificate @ git+https://github.com/flxk1/oversight-certificate@v0.2.0",
    "governance-certification @ git+https://github.com/flxk1/governance-certification@v0.2.0",
    "norm-freshness @ git+https://github.com/flxk1/norm-freshness@v0.3.0",
    "obligation-discharge @ git+https://github.com/flxk1/obligation-discharge@v0.1.0",
    "effect-reconciliation @ git+https://github.com/flxk1/effect-reconciliation@v0.2.0",
    "enforcement-posture @ git+https://github.com/flxk1/enforcement-posture@v0.5.1",
    "5d-nd @ git+https://github.com/flxk1/5d-nd@v0.2.0",
    "loomground-audit-chain @ git+https://github.com/flxk1/loomground-audit-chain@loomground-audit-chain-v0.1.0",
    "loomground-lock @ git+https://github.com/flxk1/loomground-lock@loomground-lock-v0.2.0",
    "loomground-lane @ git+https://github.com/flxk1/loomground-lane@loomground-lane-v0.1.0",
    "loomground-drift @ git+https://github.com/flxk1/loomground-drift@loomground-drift-v0.2.0",
    "loomground-erasure @ git+https://github.com/flxk1/loomground-erasure@loomground-erasure-v0.1.0",
    "policy-compiler @ git+https://github.com/flxk1/policy-compiler@74e7fc4c9180b53179272ba5ddc3f591f3ee09d0",
    "evidence-emitter @ git+https://github.com/flxk1/evidence-emitter@4869b1f90ad12bee25cd19da3bb8b56d69de598c",
    "privacy-shield @ git+https://github.com/flxk1/privacy-shield@a774b39e64a9aff19dc08c03d5216edaa9eb327d",
    "a2a-compliance @ git+https://github.com/flxk1/a2a-compliance@5c6f2c14af46e85989a443c51be103f248151d62",
    "loomground-workspace @ git+https://github.com/flxk1/loomground-workspace@v0.1.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
loomground-mcp = "loomground_mcp.server:main"

[project.urls]
Homepage = "https://github.com/flxk1/loomground-mcp"
Repository = "https://github.com/flxk1/loomground-mcp"
Issues = "https://github.com/flxk1/loomground-mcp/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_mcp._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_mcp*"]

[tool.setuptools.package-data]
# a skill ships whole: its SKILL.md and every file that SKILL.md's instructions reach for
loomground_mcp = ["py.typed", "catalogue.json", "releases.json", "skills/*.json", "skills/**/*"]

[tool.setuptools.exclude-package-data]
# what the skill glob would otherwise sweep up from a working tree: byte-code an install or a local run compiled.
# tests/test_skills_vendoring.py holds the expansion of both lists to exactly the manifest plus the two records.
loomground_mcp = ["skills/**/__pycache__/*", "skills/**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
