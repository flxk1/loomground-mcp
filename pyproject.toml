[build-system]
requires = ["setuptools>=62.3"]  # `**` in package-data, so a skill directory ships whole
build-backend = "setuptools.build_meta"

[project]
name = "loomground-mcp"
description = "One MCP server exposing the Loomground planes as tools: versum, the four languages, solver and its skills, ingest, operators, assurance, controls; stdio or HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# `mcp` is the one third-party dependency. Every other name is a sibling plane,
# ranged here and git-pinned in requirements-dev.txt until the planes are on an index.
dependencies = [
    "mcp>=2,<3",
    "loomground-governance>=0.11,<0.12",
    "loomground-versum>=0.13,<0.15",
    "loomground-deontic>=0.1,<0.3",
    "loomground-factual>=0.1,<0.2",
    "loomground-epistemic>=0.1,<0.2",
    "loomground-norm>=0.1,<0.2",
    "loomground-solver>=0.5,<0.7",
    "loomground-ingest>=0.2,<0.4",
    "loomground-brief>=0.1,<0.3",
    "loomground-collapse>=0.1,<0.3",
    "loomground-escalation>=0.1,<0.3",
    "loomground-falsifiability>=0.1,<0.3",
    "loomground-proxy>=0.1,<0.3",
    "loomground-mandate>=0.1,<0.3",
    "oversight-certificate>=0.2,<0.3",
    "governance-certification>=0.1,<0.3",
    "norm-freshness>=0.3,<0.4",
    "obligation-discharge>=0.1,<0.2",
    "effect-reconciliation>=0.2,<0.3",
    "enforcement-posture>=0.5,<0.6",
    "5d-nd>=0.1,<0.3",
    "loomground-audit-chain>=0.1,<0.2",
    "loomground-lock>=0.1,<0.3",
    "loomground-lane>=0.1,<0.2",
    "loomground-drift>=0.1,<0.3",
    "loomground-erasure>=0.1,<0.2",
    "policy-compiler>=0.3,<0.4",
    "evidence-emitter>=0.1,<0.2",
    "privacy-shield>=2,<3",
    "a2a-compliance>=0.3,<0.4",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
loomground-mcp = "loomground_mcp.server:main"

[project.urls]
Homepage = "https://github.com/flxk1/loomground-mcp"
Repository = "https://github.com/flxk1/loomground-mcp"
Issues = "https://github.com/flxk1/loomground-mcp/issues"

[tool.setuptools.dynamic]
version = { attr = "loomground_mcp._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_mcp*"]

[tool.setuptools.package-data]
# a skill ships whole: its SKILL.md and every file that SKILL.md's instructions reach for
loomground_mcp = ["py.typed", "catalogue.json", "releases.json", "skills/*.json", "skills/**/*"]

[tool.setuptools.exclude-package-data]
# what the skill glob would otherwise sweep up from a working tree: byte-code an install or a local run compiled.
# tests/test_skills_vendoring.py holds the expansion of both lists to exactly the manifest plus the two records.
loomground_mcp = ["skills/**/__pycache__/*", "skills/**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
