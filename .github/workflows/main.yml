name: main

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e ".[dev]"
      # the solver skill scripts live in the loomground-solver checkout, not its wheel: fetch the pinned commit for the parity tests
      - run: |
          sha=$(sed -n 's#^loomground-solver @ git+https://github.com/flxk1/loomground-solver@\([0-9a-f]*\).*#\1#p' requirements-dev.txt)
          git init -q solver-skills && git -C solver-skills fetch -q --depth 1 https://github.com/flxk1/loomground-solver "$sha" && git -C solver-skills checkout -q FETCH_HEAD
      # the .lt examples live in the loomground-topos spec repo: fetch the commit the topos reader implements
      - run: |
          git init -q topos-spec && git -C topos-spec fetch -q --depth 1 https://github.com/flxk1/loomground-topos c71f81cb44ca419bd67451290ab07b387404f297 && git -C topos-spec checkout -q FETCH_HEAD
      # the vendored catalogue.json is checked byte-for-byte against CATALOGUE.json at the loomground commit it was
      # taken from (tools/catalogue.py SOURCE). That commit is public and fetches; the fetch is unguarded, because a
      # guard turned a lost fetch into a silent skip and stopped asserting the parity — test_ci_has_every_pinned_source
      # is the backstop if one arrives absent anyway
      - run: |
          sha=$(sed -n 's#.*"commit": "\([0-9a-f]*\)".*#\1#p' src/loomground_mcp/tools/catalogue.py)
          git init -q loomground-cat
          git -C loomground-cat fetch -q --depth 1 https://github.com/flxk1/loomground "$sha"
          git -C loomground-cat checkout -q FETCH_HEAD
      # the vendored releases.json, the same way, against RELEASES.json at the commit tools/releases.py SOURCE names
      - run: |
          sha=$(sed -n 's#.*"commit": "\([0-9a-f]*\)".*#\1#p' src/loomground_mcp/tools/releases.py)
          git init -q loomground-rel
          git -C loomground-rel fetch -q --depth 1 https://github.com/flxk1/loomground "$sha"
          git -C loomground-rel checkout -q FETCH_HEAD
      # the vendored skills against each repository at the commit skills/index.json pins, one fetch per public
      # repository; unguarded for the same reason. A private record carries no body and is not fetched
      - run: |
          mkdir -p skills-src
          python -c 'import json; [print(e["repo"], e["commit"]) for e in json.load(open("src/loomground_mcp/skills/index.json")) if not e.get("private")]' | sort -u | while read repo sha; do
            git init -q "skills-src/$repo"
            git -C "skills-src/$repo" fetch -q --depth 1 "https://github.com/flxk1/$repo" "$sha" || exit 1
          done
      # skills_lint is the family's Agent Skills linter (flxk1/repo-standards); this repository holds its own
      # vendored skills to it instead of waiting for a sweep, so the fetch is unguarded — losing it fails the job
      - run: |
          git init -q standards
          git -C standards fetch -q --depth 1 https://github.com/flxk1/repo-standards 0a99ad8480f71dd258d8edbf9b7087ab5417e39c
          git -C standards checkout -q FETCH_HEAD
      # the vendored tree against the manifest that recorded copying it: no checkout, no network, never skipped
      - run: python tools/vendor_skills.py --check
      - run: python -m pytest -q
        env:
          REPO_STANDARDS: ${{ github.workspace }}/standards
          LOOMGROUND_SOLVER_SKILLS: ${{ github.workspace }}/solver-skills/skills
          LOOMGROUND_TOPOS_EXAMPLES: ${{ github.workspace }}/topos-spec/examples
          LOOMGROUND_CATALOGUE: ${{ github.workspace }}/loomground-cat/CATALOGUE.json
          LOOMGROUND_RELEASES: ${{ github.workspace }}/loomground-rel/RELEASES.json
          LOOMGROUND_SKILLS_ROOT: ${{ github.workspace }}/skills-src
