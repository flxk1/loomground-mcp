name: main

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt && python -m pip install -e ".[dev]"
      # the solver skill scripts live in the loomground-solver checkout, not its wheel: fetch the pinned commit for the parity tests
      - run: |
          sha=$(sed -n 's#^loomground-solver @ git+https://github.com/flxk1/loomground-solver@\([0-9a-f]*\).*#\1#p' requirements-dev.txt)
          git init -q solver-skills && git -C solver-skills fetch -q --depth 1 https://github.com/flxk1/loomground-solver "$sha" && git -C solver-skills checkout -q FETCH_HEAD
      - run: python -m pytest -q
        env:
          LOOMGROUND_SOLVER_SKILLS: ${{ github.workspace }}/solver-skills/skills
